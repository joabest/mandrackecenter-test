name: Validate Next.js build
on:
  push:
    branches: [test]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Permission regression tests
        run: npm test
      - name: Production build (without deploying)
        run: npm run build
        env:
          VERCEL_ENV: preview
